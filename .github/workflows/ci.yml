name: CI

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    name: Validate and publish image
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: web
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_CI_ROLE_ARN: ${{ vars.AWS_CI_ROLE_ARN }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_TELEMETRY_DISABLED: "1"
      AWS_PAGER: ""
      AWS_CLI_AUTO_PROMPT: "off"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check repository variables
        run: |
          for variable in AWS_REGION AWS_CI_ROLE_ARN ECR_REPOSITORY NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing repository variable $variable"
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Generate route types
        run: npx --no-install next typegen

      - name: Check types
        run: npx --no-install tsc --noEmit

      - name: Build application
        run: npm run build

      - name: Assume AWS CI role through OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_CI_ROLE_ARN }}
          role-session-name: github-ci-${{ github.run_id }}
          role-duration-seconds: 1800
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build Docker image
        working-directory: .
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build \
            --build-arg "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" \
            --build-arg "NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA" \
            ./web

      - name: Publish immutable image
        working-directory: .
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: bash .github/scripts/push-ecr-image.sh

      - name: Summarize CI result
        if: always()
        working-directory: .
        env:
          RESULT: ${{ job.status }}
        run: printf '### CI\n\n- Result **%s**\n- Commit `%s`\n' "$RESULT" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to k3s
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      performed: ${{ steps.current.outputs.deploy }}
    concurrency:
      group: shiftplanner-k3s
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      HEALTH_URL: ${{ vars.SHIFTPLANNER_HEALTH_URL }}
      AWS_PAGER: ""
      AWS_CLI_AUTO_PROMPT: "off"
    steps:
      - name: Confirm current main commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$main_sha" == "$GITHUB_SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Deployment skipped because main advanced to $main_sha."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check deployment variables
        if: steps.current.outputs.deploy == 'true'
        run: |
          for variable in AWS_REGION AWS_DEPLOY_ROLE_ARN ECR_REPOSITORY EC2_INSTANCE_ID HEALTH_URL; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing deployment variable $variable"
              exit 1
            fi
          done

      - name: Check out repository
        if: steps.current.outputs.deploy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assume AWS deploy role through OIDC
        if: steps.current.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-deploy-${{ github.run_id }}
          role-duration-seconds: 1800
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Deploy image through SSM and verify health
        if: steps.current.outputs.deploy == 'true'
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          export IMAGE_URI="$account.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$GITHUB_SHA"
          bash .github/scripts/deploy-ssm.sh

      - name: Summarize deployment result
        if: always()
        env:
          RESULT: ${{ job.status }}
          DEPLOY: ${{ steps.current.outputs.deploy }}
        run: |
          if [[ "$RESULT" == success && "$DEPLOY" == false ]]; then
            RESULT="skipped because main advanced"
          fi
          printf '### CD\n\n- Result **%s**\n- Commit `%s`\n' "$RESULT" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  notify:
    name: Notify Discord (optional)
    needs: [ci, deploy]
    if: ${{ !cancelled() && (needs.ci.result == 'success' || needs.ci.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Send CI/CD result
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CI_RESULT: ${{ needs.ci.result }}
          CD_RESULT: ${{ needs.deploy.result }}
          CD_PERFORMED: ${{ needs.deploy.outputs.performed }}
        run: |
          node --input-type=module <<'NODE'
          const webhook = process.env.DISCORD_WEBHOOK_URL?.trim();
          if (!webhook) process.exit(0);

          if (!/^https:\/\/discord\.com\/api\/webhooks\/[0-9]+\/[A-Za-z0-9_-]+$/.test(webhook)) {
            console.warn("::warning::DISCORD_WEBHOOK_URL must be a Discord webhook URL.");
            process.exit(0);
          }

          const {
            GITHUB_SERVER_URL, GITHUB_REPOSITORY, GITHUB_REF_NAME, GITHUB_SHA, GITHUB_RUN_ID,
            CI_RESULT, CD_RESULT, CD_PERFORMED,
          } = process.env;
          const deployment = CD_RESULT === "success" && CD_PERFORMED !== "true" ? "skipped" : CD_RESULT;
          const content = [
            `Repository ${GITHUB_REPOSITORY}`,
            `Branch ${GITHUB_REF_NAME.slice(0, 200)}`,
            `Commit ${GITHUB_SHA}`,
            `CI ${CI_RESULT} | CD ${deployment}`,
            `${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}`,
          ].join("\n");

          try {
            const response = await fetch(webhook, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ content, allowed_mentions: { parse: [] } }),
              redirect: "error",
              signal: AbortSignal.timeout(10000),
            });
            if (!response.ok) console.warn(`::warning::Discord returned HTTP ${response.status}.`);
          } catch {
            console.warn("::warning::Discord notification could not be delivered.");
          }
          NODE
