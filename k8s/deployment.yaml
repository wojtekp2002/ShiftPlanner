apiVersion: apps/v1
kind: Deployment
metadata:
  name: shiftplanner
  namespace: shiftplanner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shiftplanner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shiftplanner
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shiftplanner
          image: 660140202510.dkr.ecr.eu-central-1.amazonaws.com/shiftplanner:691ea0bda73d04c169cf5d4e0293efc21879eed0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
