apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: shiftplanner-alloy-pod-discovery
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shiftplanner-alloy-pod-discovery
  namespace: shiftplanner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: shiftplanner-alloy-pod-discovery
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shiftplanner-alloy-pod-discovery
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: shiftplanner-alloy-pod-discovery
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy
  namespace: monitoring
data:
  config.alloy: |
    discovery.kubernetes "pods" {
      role = "pod"

      namespaces {
        names = ["shiftplanner", "kube-system"]
      }

      selectors {
        role  = "pod"
        field = "spec.nodeName=" + sys.env("NODE_NAME")
      }
    }

    discovery.relabel "container_logs" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
        regex         = "shiftplanner;shiftplanner|kube-system;(traefik|coredns)"
        action        = "keep"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "app"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        regex         = "(.+)"
        target_label  = "app"
      }

      rule {
        source_labels = [
          "__meta_kubernetes_namespace",
          "__meta_kubernetes_pod_name",
          "__meta_kubernetes_pod_uid",
          "__meta_kubernetes_pod_container_name",
        ]
        regex        = "(.+);(.+);(.+);(.+)"
        replacement  = "/var/log/pods/${1}_${2}_${3}/${4}/*.log"
        target_label = "__path__"
      }

      rule {
        action = "labelkeep"
        regex  = "__path__|namespace|pod|container|app"
      }
    }

    loki.source.file "containers" {
      targets    = discovery.relabel.container_logs.output
      forward_to = [loki.process.container_logs.receiver]

      file_match {
        enabled     = true
        sync_period = "10s"
      }
    }

    loki.process "container_logs" {
      forward_to = [loki.write.internal.receiver]

      stage.cri {
        max_partial_line_size          = 16384
        max_partial_line_size_truncate = true
        max_partial_lines              = 32
      }

      stage.replace {
        expression = "\\b(eyJ[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+|sb_secret_[A-Za-z0-9_-]+|(?:AKIA|ASIA)[A-Z0-9]{16})\\b"
        replace    = "[REDACTED]"
      }

      stage.replace {
        expression = "(?i)\\bauthorization[\"']?\\s*[:=]\\s*[\"']?(?:(?:basic|bearer)\\s+)?([^\"'\\s,;}]+)"
        replace    = "[REDACTED]"
      }

      stage.replace {
        expression = "(?i)\\b(?:password|passwd|aws_secret_access_key|aws_session_token|supabase_service_role_key|supabase_secret_key)[\"']?\\s*[:=]\\s*\"((?:[^\"\\\\\\r\\n]|\\\\.)*)\""
        replace    = "[REDACTED]"
      }

      stage.replace {
        expression = "(?i)\\b(?:password|passwd|aws_secret_access_key|aws_session_token|supabase_service_role_key|supabase_secret_key)[\"']?\\s*[:=]\\s*'?([^\"'\\s,;}]+)"
        replace    = "[REDACTED]"
      }

      stage.label_keep {
        values = ["namespace", "pod", "container", "app"]
      }
    }

    loki.write "internal" {
      endpoint {
        url        = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        batch_size = "128KiB"
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
    spec:
      serviceAccountName: alloy
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alloy
          image: docker.io/grafana/alloy:v1.21.3@sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - --server.http.enable-pprof=false
            - --server.http.disable-support-bundle
            - --storage.path=/var/lib/alloy
            - --disable-reporting
            - /etc/alloy/config.alloy
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: GOMEMLIMIT
              value: 80MiB
          ports:
            - name: http
              containerPort: 12345
          startupProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
              ephemeral-storage: 4Mi
            limits:
              cpu: 150m
              memory: 112Mi
              ephemeral-storage: 48Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
              readOnly: true
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: state
              mountPath: /var/lib/alloy
      volumes:
        - name: config
          configMap:
            name: alloy
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: state
          emptyDir:
            sizeLimit: 32Mi
