apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - namespace.yaml
  - prometheus.yaml
  - kube-state-metrics.yaml
  - node-exporter.yaml
  - blackbox-exporter.yaml
  - grafana.yaml

configMapGenerator:
  - name: grafana-dashboard
    files:
      - dashboards/shiftplanner.json
      - dashboards/shiftplanner-logs.json
